<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TeacherSystem — نظام الإدارة التعليمية والتجارية المتكامل للمعلمين في مصر">
  <title>TeacherSystem — نظام إدارة المعلم</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <!-- Main Application Container -->
  <div id="app">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--slate-500); font-family: var(--font-family);">
      <div style="text-align: center;">
        <div style="width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem;"></div>
        <p style="font-weight: 600;">جارٍ تشغيل نظام TeacherSystem...</p>
      </div>
    </div>
  </div>

  <!-- Toast Notifications Root -->
  <div id="toast-container"></div>

  <!-- Loading Animation Helper -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Modular Frontend Core Entrypoint -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
